<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JP Beginner Practice</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #ff6f61;
        --primary-soft: #ffe4df;
        --accent: #2a7de1;
        --accent-soft: #eaf2ff;
        --success: #1da574;
        --text: #1e293b;
        --muted: #64748b;
        --shadow: 0 10px 30px rgba(30, 41, 59, 0.08);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        background: linear-gradient(180deg, #eef7ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 18px 12px 28px;
      }

      .phone {
        width: min(100%, 430px);
        min-height: calc(100vh - 36px);
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(148,163,184,0.2);
        backdrop-filter: blur(12px);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 20px 18px 12px;
        background: linear-gradient(135deg, #ffffff 0%, #f5f9ff 100%);
        border-bottom: 1px solid rgba(148,163,184,0.15);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .signal {
        display: flex;
        gap: 4px;
        align-items: end;
      }

      .signal span {
        display: block;
        width: 4px;
        border-radius: 4px;
        background: var(--success);
      }

      .signal span:nth-child(1) { height: 5px; }
      .signal span:nth-child(2) { height: 8px; }
      .signal span:nth-child(3) { height: 12px; }
      .signal span:nth-child(4) { height: 16px; }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .badge {
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 8px 10px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        padding: 12px 14px 0;
      }

      .tab {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        padding: 12px 8px;
        border-radius: 14px;
        font-size: 0.9rem;
        transition: 0.2s ease;
      }

      .tab.active {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .content {
        flex: 1;
        overflow: auto;
        padding: 16px 14px 90px;
      }

      .panel {
        display: none;
      }

      .panel.active {
        display: block;
      }

      .hero {
        background: linear-gradient(135deg, var(--primary) 0%, #ff8a65 100%);
        color: white;
        border-radius: var(--radius);
        padding: 18px 16px;
        box-shadow: var(--shadow);
        margin-bottom: 16px;
      }

      .hero h2 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }

      .hero p {
        margin: 0;
        font-size: 0.85rem;
        opacity: 0.95;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }

      .stat {
        background: var(--panel);
        border-radius: 18px;
        padding: 12px 10px;
        text-align: center;
        box-shadow: 0 8px 22px rgba(148,163,184,0.08);
      }

      .stat strong {
        display: block;
        font-size: 1.2rem;
        margin-bottom: 4px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0 12px;
      }

      .section-title h3 {
        margin: 0;
        font-size: 1rem;
      }

      .chip {
        background: var(--panel);
        border: 1px solid rgba(148,163,184,0.18);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.72rem;
        color: var(--muted);
      }

      .word-list {
        display: grid;
        gap: 12px;
      }

      .word-card {
        background: var(--panel);
        border-radius: 18px;
        padding: 12px 12px 10px;
        box-shadow: 0 8px 22px rgba(148,163,184,0.08);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .word-title-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }

      .japanese {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }

      .japanese strong {
        font-size: 1.2rem;
        letter-spacing: 0.04em;
        line-height: 1.2;
      }

      .small-btn {
        border: none;
        background: linear-gradient(135deg, var(--accent-soft) 0%, #dfeeff 100%);
        color: var(--accent);
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 12px;
        font-weight: 700;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 0 1px rgba(42,125,225,0.08);
        flex-shrink: 0;
      }

      .kana {
        display: block;
        color: var(--muted);
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        margin-top: 2px;
      }

      .romaji {
        color: var(--muted);
        font-size: 0.68rem;
      }

      .meta {
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 4px 7px;
        font-size: 0.66rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      .meaning {
        font-size: 0.95rem;
        margin: 10px 0 6px;
      }

      .example-list {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .example {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .example-text {
        flex: 1;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.6;
      }

      .example-text ruby {
        ruby-position: over;
      }

      .example-text rt {
        font-size: 0.58em;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .example-translation {
        display: block;
        margin-top: 4px;
        color: var(--text);
        opacity: 0.8;
      }

      .example-btn {
        border: none;
        background: rgba(42,125,225,0.08);
        color: var(--accent);
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        flex-shrink: 0;
      }

      .card-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 12px;
      }

      .favorite {
        border: none;
        background: transparent;
        font-size: 1rem;
        padding: 4px 6px;
        opacity: 0.8;
      }

      .quiz-card {
        background: var(--panel);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 8px 26px rgba(148,163,184,0.08);
        margin-bottom: 14px;
      }

      .quiz-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .quiz-prompt {
        font-size: 1.15rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .option-list {
        display: grid;
        gap: 10px;
      }

      .option {
        width: 100%;
        border: 1px solid rgba(148,163,184,0.25);
        background: #f8fbff;
        border-radius: 14px;
        padding: 12px 10px;
        font-size: 0.95rem;
        text-align: left;
        color: var(--text);
      }

      .option.correct {
        background: rgba(29, 165, 116, 0.1);
        border-color: rgba(29,165,116,0.35);
        color: #0d6f52;
      }

      .option.wrong {
        background: rgba(255,111,97,0.08);
        border-color: rgba(255,111,97,0.3);
        color: #b94c41;
      }

      .quiz-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .primary-btn, .secondary-btn {
        flex: 1;
        border: none;
        border-radius: 14px;
        padding: 12px 10px;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .primary-btn {
        background: var(--primary);
        color: #fff;
      }

      .secondary-btn {
        background: #edf2ff;
        color: var(--accent);
      }

      .topics {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .topic-btn {
        border: 1px solid rgba(148,163,184,0.25);
        background: white;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.78rem;
      }

      .topic-btn.active {
        background: var(--primary-soft);
        border-color: rgba(255,111,97,0.28);
        color: var(--primary);
      }

      .chat-box {
        background: var(--panel);
        border-radius: 22px;
        padding: 14px;
        box-shadow: 0 8px 26px rgba(148,163,184,0.08);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .bubble {
        max-width: 80%;
        padding: 10px 12px;
        border-radius: 16px;
        font-size: 0.91rem;
        line-height: 1.5;
      }

      .bubble.ai {
        align-self: flex-start;
        background: #eef5ff;
        color: var(--text);
        border-bottom-left-radius: 6px;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--primary-soft);
        color: var(--text);
        border-bottom-right-radius: 6px;
      }

      .chat-line {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .chat-text {
        flex: 1;
        min-width: 0;
      }

      .ja-line {
        display: block;
        line-height: 1.6;
      }

      .ja-kana {
        display: block;
        margin-top: 2px;
        font-size: 0.68rem;
        line-height: 1.4;
        color: rgba(30, 41, 59, 0.7);
        letter-spacing: 0.04em;
      }

      .speak-btn {
        border: none;
        background: rgba(42,125,225,0.08);
        color: var(--accent);
        width: 30px;
        height: 30px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        flex-shrink: 0;
        cursor: pointer;
      }

      .conversation-input {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .conversation-input input {
        flex: 1;
        border: 1px solid rgba(148,163,184,0.22);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 0.95rem;
        background: white;
      }

      .conversation-input button {
        border: none;
        background: var(--accent);
        color: white;
        border-radius: 14px;
        padding: 0 16px;
        font-weight: 700;
      }

      .page-nav {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 16px;
        padding: 0 2px;
      }

      #vocab-panel .page-nav {
        display: flex;
      }

      .page-btn {
        border: none;
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 700;
        font-size: 0.82rem;
        background: #edf2ff;
        color: var(--accent);
      }

      .page-btn:disabled {
        opacity: 0.45;
      }

      .page-indicator {
        font-size: 0.8rem;
        color: var(--muted);
        min-width: 70px;
        text-align: center;
        font-weight: 700;
      }

      .conversation-page-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        padding: 0 2px;
      }

      .conversation-page-btn {
        border: none;
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 700;
        font-size: 0.82rem;
        background: #edf2ff;
        color: var(--accent);
      }

      .conversation-page-btn:disabled {
        opacity: 0.45;
      }

      .conversation-page-indicator {
        font-size: 0.8rem;
        color: var(--muted);
        min-width: 70px;
        text-align: center;
        font-weight: 700;
      }

      .bottom-nav {
        position: sticky;
        bottom: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px 14px 14px;
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(148,163,184,0.16);
      }

      .nav-btn {
        border: none;
        background: #eef5ff;
        color: var(--muted);
        border-radius: 14px;
        padding: 10px 8px;
        font-weight: 700;
      }

      .nav-btn.active {
        background: var(--primary);
        color: white;
      }

      @media (max-width: 360px) {
        .phone {
          border-radius: 20px;
        }

        .brand h1 {
          font-size: 1.2rem;
        }

        .stats {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="topbar">
        <div class="status-row">
          <span>9:41</span>
          <div class="signal" aria-label="signal strength">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="brand">
          <h1>JP Learn</h1>
          <div class="badge">LEVEL 1</div>
        </div>
      </header>

      <nav class="tabs" aria-label="practice menu">
        <button class="tab active" data-panel="vocab-panel">단어</button>
        <button class="tab" data-panel="dialogue-panel">회화</button>
      </nav>

      <main class="content">
        <section id="vocab-panel" class="panel active">
          <div class="hero">
            <h2>오늘의 일본어 기본</h2>
            <p>짧게, 자주, 쉽게 연습해보세요.</p>
          </div>

          <div class="stats">
            <div class="stat">
              <strong id="learnedCount">0</strong>
              <span>배운 단어</span>
            </div>
            <div class="stat">
              <strong>12</strong>
              <span>오늘 목표</span>
            </div>
            <div class="stat">
              <strong>89%</strong>
              <span>복습률</span>
            </div>
          </div>

          <div class="section-title">
            <h3>추천 단어</h3>
            <span class="chip">초급</span>
          </div>

          <div id="wordList" class="word-list"></div>

          <div class="page-nav" aria-label="단어 페이지 이동">
            <button id="prevPageBtn" class="page-btn" type="button">이전</button>
            <span id="pageIndicator" class="page-indicator">1 / 1</span>
            <button id="nextPageBtn" class="page-btn" type="button">다음</button>
          </div>
        </section>

        <section id="dialogue-panel" class="panel">
          <div class="section-title">
            <h3>회화 주제</h3>
            <span class="chip">실전</span>
          </div>

          <div id="topicList" class="topics"></div>

          <div class="chat-box" id="chatBox"></div>

          <div class="conversation-page-nav" aria-label="회화 문장 페이지 이동">
            <button id="conversationPrevBtn" class="conversation-page-btn" type="button">이전</button>
            <span id="conversationPageIndicator" class="conversation-page-indicator">1 / 1</span>
            <button id="conversationNextBtn" class="conversation-page-btn" type="button">다음</button>
          </div>

          <div class="conversation-input">
            <input id="userInput" type="text" placeholder="예시: 안녕하세요!" aria-label="회화 연습 입력" />
            <button id="sendBtn">전송</button>
          </div>
        </section>
      </main>

      <div class="bottom-nav" aria-label="bottom navigation">
        <button class="nav-btn active" data-panel="vocab-panel">단어</button>
        <button class="nav-btn" data-panel="dialogue-panel">회화</button>
      </div>
    </div>

    <script>
      const baseVocabulary = [
        { word: 'こんにちは', meaning: '안녕하세요', romaji: 'konnichiwa', example: 'こんにちは、今日はいい天気ですね。', example2: '今日は会えてうれしいです。', exampleKo: '안녕하세요, 오늘 날씨가 좋네요.', exampleKo2: '오늘 만나서 기뻐요.', category: '인사' },
        { word: 'ありがとう', meaning: '감사합니다', romaji: 'arigatou', example: 'ありがとう、助けてくれて。', example2: 'いつも助けてくれてありがとう。', exampleKo: '고마워, 도와줘서.', exampleKo2: '항상 도와줘서 고마워.', category: '감사' },
        { word: 'すみません', meaning: '실례합니다 / 죄송합니다', romaji: 'sumimasen', example: 'すみません、駅はどこですか？', example2: 'すみません、少し見せてください。', exampleKo: '실례합니다, 역이 어디인가요?', exampleKo2: '죄송합니다, 잠깐 보여주세요.', category: '표현' },
        { word: 'おはようございます', meaning: '좋은 아침입니다', romaji: 'ohayou gozaimasu', example: 'おはようございます！今日も頑張りましょう。', example2: 'おはようございます、早起きできてよかったです。', exampleKo: '좋은 아침입니다! 오늘도 힘내요.', exampleKo2: '좋은 아침입니다, 일찍 일어나서 다행이었어요.', category: '인사' },
        { word: '食べる', meaning: '먹다', romaji: 'taberu', example: '朝ごはんを食べます。', example2: '昼ごはんを食べてから仕事に行きます。', exampleKo: '아침밥을 먹습니다.', exampleKo2: '점심을 먹고 나서 일하러 갑니다.', category: '동사' },
        { word: '水', meaning: '물', romaji: 'mizu', example: '水を一杯ください。', exampleKo: '물을 한 잔 주세요.', category: '명사' },
        { word: '駅', meaning: '역', romaji: 'eki', example: '駅で友達を待っています。', exampleKo: '역에서 친구를 기다리고 있습니다.', category: '장소' },
        { word: '行きます', meaning: '가다', romaji: 'ikimasu', example: '学校に行きます。', exampleKo: '학교에 갑니다.', category: '동사' },
        { word: '大丈夫', meaning: '괜찮다 / 문제없다', romaji: 'daijoubu', example: '大丈夫です、心配しないでください。', exampleKo: '괜찮아요, 걱정하지 마세요.', category: '표현' },
        { word: '明日', meaning: '내일', romaji: 'ashita', example: '明日、友達と映画を見ます。', exampleKo: '내일 친구와 영화를 봅니다.', category: '시간' },
        { word: '家', meaning: '집', romaji: 'ie', example: '家でゆっくり休みます。', exampleKo: '집에서 편안히 쉴 거예요.', category: '장소' },
        { word: '会社', meaning: '회사', romaji: 'kaisha', example: '会社に行くのが少し遅れました。', exampleKo: '회사에 가는 게 조금 늦었습니다.', category: '일상' },
        { word: '人', meaning: '사람', romaji: 'hito', example: 'この人はとても親切です。', exampleKo: '이 분은 매우 친절하세요.', category: '명사' },
        { word: '時間', meaning: '시간', romaji: 'jikan', example: '時間がありません。', exampleKo: '시간이 없습니다.', category: '시간' },
        { word: '買う', meaning: '사다', romaji: 'kau', example: 'スーパーでパンを買います。', exampleKo: '슈퍼에서 빵을 삽니다.', category: '동사' },
        { word: '休み', meaning: '휴식, 쉬는 날', romaji: 'yasumi', example: '明日は休みです。', exampleKo: '내일은 쉬는 날입니다.', category: '시간' },

      function buildDistinctExamplePair(item, fallbackSeed = 0) {
        const primary = item.example || `${item.word}を使った例文です。`;
        const variants = [
          `${item.word}を使うと、会話がもっと自然になります。`,
          `この場面では${item.word}がとても役立ちます。`,
          `今日は${item.word}を使って表現してみましょう。`,
          `友達との会話で${item.word}をよく使います。`,
          `${item.word}を使うと、相手に伝わりやすくなります。`
        ];

        const targetIndex = (fallbackSeed + (item.word.length % variants.length)) % variants.length;
        let second = variants[targetIndex];
        if (normalizeExample(second) === normalizeExample(primary)) {
          second = variants[(targetIndex + 1) % variants.length];
        }

        const secondKo = [
          `${item.meaning}을 사용하면 대화가 더 자연스러워집니다.`,
          `이 상황에서는 ${item.meaning}이 정말 유용합니다.`,
          `오늘은 ${item.meaning}을 써서 표현해 봐요.`,
          `친구와의 대화에서 ${item.meaning}을 자주 사용해요.`,
          `${item.meaning}을 쓰면 상대에게 더 잘 전달됩니다.`
        ][targetIndex] || `${item.meaning}을 사용하면 더 자연스럽게 전달할 수 있어요.`;

        return {
          example2: second,
          exampleKo2: secondKo
        };
      }

      function buildVocabulary(count) {
        const vocabulary = baseVocabulary.map((item, index) => {
          const fallback = getFallbackExample(item);
          const generated = buildDistinctExamplePair(item, index);
          const example2 = item.example2 || generated.example2;
          const exampleKo2 = item.exampleKo2 || generated.exampleKo2;

          return {
            ...item,
            kana: item.kana || resolveWordKana(item.word),
            example2: normalizeExample(example2) === normalizeExample(item.example || '') ? fallback.ja : example2,
            exampleKo2: normalizeExample(exampleKo2) === normalizeExample(item.exampleKo || '') ? fallback.ko : exampleKo2
          };
        });

        for (let i = baseVocabulary.length; i < count; i += 1) {
          const seed = vocabulary[i % vocabulary.length];
          const exampleSuffix = ` (${i + 1})`;
          const generated = buildDistinctExamplePair({
            ...seed,
            example: seed.example || `${seed.word}を使った例文です。`,
            exampleKo: seed.exampleKo || `${seed.meaning}을 사용한 예문입니다.`,
            meaning: seed.meaning || '사용하다'
          }, i);
          vocabulary.push({
            ...seed,
            kana: seed.kana || resolveWordKana(seed.word),
            example: `${seed.example || seed.word}${exampleSuffix}`,
            exampleKo: `${seed.exampleKo || seed.meaning}${exampleSuffix}`,
            example2: `${generated.example2}${exampleSuffix}`,
            exampleKo2: `${generated.exampleKo2}${exampleSuffix}`
          });
        }

        return vocabulary;
      }

      function makeConversationSet(baseEntries, extraEntries) {
        const combined = [...baseEntries, ...extraEntries];
        const uniqueEntries = [];
        const seen = new Set();

        combined.forEach((entry) => {
          const key = normalizeExample(entry.ja);
          if (!key || seen.has(key)) {
            return;
          }
          seen.add(key);
          uniqueEntries.push({
            ja: entry.ja,
            ko: entry.ko,
            kana: entry.kana || entry.ja
          });
        });

        if (uniqueEntries.length === 0) {
          return [];
        }

        for (let i = uniqueEntries.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [uniqueEntries[i], uniqueEntries[j]] = [uniqueEntries[j], uniqueEntries[i]];
        }

        return uniqueEntries;
      }

      function renderSentenceWithFurigana(sentence) {
        const patterns = Object.keys(furiganaMap)
          .filter((word) => sentence.includes(word))
          .sort((a, b) => b.length - a.length);

        let rendered = sentence;
        patterns.forEach((word) => {
          const kana = furiganaMap[word];
          if (!kana) return;
          rendered = rendered.split(word).join(`<ruby><rb>${word}</rb><rt>${kana}</rt></ruby>`);
        });

        return rendered;

      const conversationPageIndicator = document.getElementById('conversationPageIndicator');
      const conversationPrevBtn = document.getElementById('conversationPrevBtn');
      const conversationNextBtn = document.getElementById('conversationNextBtn');

      function renderWords() {
        const totalPages = Math.max(1, Math.ceil(vocabulary.length / itemsPerPage));
        state.page = Math.min(state.page, totalPages - 1);

        const pageItems = vocabulary.slice(state.page * itemsPerPage, (state.page + 1) * itemsPerPage);
        wordList.innerHTML = pageItems.map((item, index) => {
          const absoluteIndex = state.page * itemsPerPage + index;
          const exampleEntries = [];
          const rawExamples = [
            { ja: item.example, ko: item.exampleKo },
            { ja: item.example2, ko: item.exampleKo2 || item.exampleKo }
          ];

          rawExamples.forEach((entry) => {
            if (!entry.ja) return;
            const alreadyExists = exampleEntries.some((existing) => normalizeExample(existing.ja) === normalizeExample(entry.ja));
            if (!alreadyExists) {
              exampleEntries.push(entry);
            }
          });

          const fallbackPool = exampleFallbackLibrary[item.category] || exampleFallbackLibrary.default;
          fallbackPool.forEach((candidate) => {
            if (exampleEntries.length >= 2) return;
            const alreadyExists = exampleEntries.some((existing) => normalizeExample(existing.ja) === normalizeExample(candidate.ja));
            if (!alreadyExists) {
              exampleEntries.push({ ja: candidate.ja, ko: candidate.ko });
            }
          });

          if (exampleEntries.length < 2) {
            const fallbackSentence = `この場面では${item.word}がとても役立ちます。`;
            const fallbackKo = `${item.meaning}이 이 상황에서 매우 유용합니다.`;
            if (!exampleEntries.some((entry) => normalizeExample(entry.ja) === normalizeExample(fallbackSentence))) {
              exampleEntries.push({ ja: fallbackSentence, ko: fallbackKo });
            }
          }

          return `
            <article class="word-card">
              <div class="card-top">
                <div class="word-title-group">
                  <div class="japanese">
                    <strong>${item.word}</strong>
                    <span class="kana">${item.kana || item.word}</span>
                    <span class="romaji">${item.romaji}</span>
                  </div>
                  <button class="small-btn" data-index="${absoluteIndex}" aria-label="발음 듣기">🔊</button>
                </div>
                <span class="meta">${item.category}</span>
              </div>
              <div class="meaning">${item.meaning}</div>
              <div class="example-list">
                ${exampleEntries.slice(0, 2).map((entry) => `
                  <div class="example">
                    <div class="example-text">
                      例: ${renderSentenceWithFurigana(entry.ja)}
                      <span class="example-translation">뜻: ${entry.ko || '해석 준비 중'}</span>
                    </div>
                    <button class="example-btn" data-example="${entry.ja}" aria-label="예문 발음 듣기">🔊</button>
                  </div>
                `).join('')}
              </div>
              <div class="card-actions">
                <button class="favorite" aria-label="favorite">⭐</button>
              </div>
            </article>
          `;
        }).join('');

        learnedCount.textContent = vocabulary.length;
        pageIndicator.textContent = `${state.page + 1} / ${totalPages}`;
        prevPageBtn.disabled = state.page === 0;
        nextPageBtn.disabled = state.page >= totalPages - 1;

        document.querySelectorAll('.small-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const idx = Number(button.dataset.index);
            speak(vocabulary[idx].word);
          });
        });

        document.querySelectorAll('.example-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const sentence = button.dataset.example;
            if (sentence) speak(sentence);
          });
        });
      }

      function changePage(direction) {
        const totalPages = Math.max(1, Math.ceil(vocabulary.length / itemsPerPage));
        state.page = Math.max(0, Math.min(totalPages - 1, state.page + direction));
        renderWords();
      }

      function speak(text) {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ja-JP';
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        }
      }

      function renderTopics() {
        const topics = Object.keys(conversationTopics);
        topicList.innerHTML = topics.map((key) => `
          <button class="topic-btn ${state.topic === key ? 'active' : ''}" data-topic="${key}">${labelForTopic(key)}</button>
        `).join('');

        topicList.querySelectorAll('.topic-btn').forEach((button) => {
          button.addEventListener('click', () => {
            state.topic = button.dataset.topic;
            state.conversationPage = 0;
            renderTopics();
            renderChat();
          });
        });
      }

      function labelForTopic(key) {
        if (key === 'talk') return '대화 요청';
        if (key === 'greeting') return '인사';
        if (key === 'travel') return '여행';
        if (key === 'food') return '음식';
        if (key === 'daily') return '일상';
        if (key === 'shopping') return '쇼핑';
        if (key === 'hospital') return '병원';
        if (key === 'work') return '업무';
        return '사회';
      }

      function renderChat() {
        const items = conversationTopics[state.topic];
        const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
        state.conversationPage = Math.min(state.conversationPage, totalPages - 1);

        const pageItems = items.slice(
          state.conversationPage * itemsPerPage,
          (state.conversationPage + 1) * itemsPerPage
        );

        chatBox.innerHTML = pageItems.map((item, index) => `
          <div class="bubble ai">
            <div class="chat-line">
              <div class="chat-text">
                <span class="ja-line">${state.conversationPage * itemsPerPage + index + 1}. ${item.ja}</span>
                <span class="ja-kana">${item.kana || item.ja}</span>
                <small>${item.ko}</small>
              </div>
              <button class="speak-btn" data-text="${item.ja}" aria-label="회화 문장 발음 듣기">🔊</button>
            </div>
          </div>
        `).join('');

        conversationPageIndicator.textContent = `${state.conversationPage + 1} / ${totalPages}`;
        conversationPrevBtn.disabled = state.conversationPage === 0;
        conversationNextBtn.disabled = state.conversationPage >= totalPages - 1;

        attachSpeechButtons();
      }

      function changeConversationPage(direction) {
        const items = conversationTopics[state.topic];
        const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
        state.conversationPage = Math.max(0, Math.min(totalPages - 1, state.conversationPage + direction));
        renderChat();
      }

      function attachSpeechButtons() {
        chatBox.querySelectorAll('.speak-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const text = button.dataset.text;
            if (text) speak(text);
          });
        });
      }

      function addUserMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        const bubble = document.createElement('div');
        bubble.className = 'bubble user';

        const line = document.createElement('div');
        line.className = 'chat-line';

        const textNode = document.createElement('div');
        textNode.className = 'chat-text';
        textNode.textContent = text;

        const speakButton = document.createElement('button');
        speakButton.className = 'speak-btn';
        speakButton.type = 'button';
        speakButton.dataset.text = text;
        speakButton.setAttribute('aria-label', '내 문장 발음 듣기');
        speakButton.textContent = '🔊';

        line.appendChild(textNode);
        line.appendChild(speakButton);
        bubble.appendChild(line);
        chatBox.appendChild(bubble);

        const response = generateReply(text);
        const aiBubble = document.createElement('div');
        aiBubble.className = 'bubble ai';

        const aiLine = document.createElement('div');
        aiLine.className = 'chat-line';

        const responseText = document.createElement('div');
        responseText.className = 'chat-text';
        responseText.textContent = response;

        const aiSpeakButton = document.createElement('button');
        aiSpeakButton.className = 'speak-btn';
        aiSpeakButton.type = 'button';
        aiSpeakButton.dataset.text = response;
        aiSpeakButton.setAttribute('aria-label', '답변 발음 듣기');
        aiSpeakButton.textContent = '🔊';

        aiLine.appendChild(responseText);
        aiLine.appendChild(aiSpeakButton);
        aiBubble.appendChild(aiLine);
        chatBox.appendChild(aiBubble);

        [speakButton, aiSpeakButton].forEach((button) => {
          button.addEventListener('click', () => {
            if (button.dataset.text) speak(button.dataset.text);
          });
        });

        chatBox.scrollTop = chatBox.scrollHeight;
        userInput.value = '';
      }

      function generateReply(input) {
        const lowered = input.toLowerCase();
        if (lowered.includes('안녕하세요') || lowered.includes('hello') || lowered.includes('こんにちは')) {
          return 'こんにちは！元気ですか？';
        }
        if (lowered.includes('감사') || lowered.includes('ありがとう')) {
          return 'いいえ、どういたしまして！';
        }
        if (lowered.includes('어디') || lowered.includes('どこ')) {
          return '駅や店の場所を聞くときによく使います。';
        }
        if (lowered.includes('음식') || lowered.includes('食べ')) {
          return '何を食べたいですか？おすすめを話してみましょう。';
        }
        return 'いい表現ですね。もう少しゆっくり、例文を使って話してみましょう。';
      }

      document.querySelectorAll('.tab').forEach((button) => {
        button.addEventListener('click', () => {
          const panel = button.dataset.panel;
          state.activeTab = panel;
          document.querySelectorAll('.tab').forEach((tab) => tab.classList.toggle('active', tab === button));
          document.querySelectorAll('.nav-btn').forEach((nav) => nav.classList.toggle('active', nav.dataset.panel === panel));
          document.querySelectorAll('.panel').forEach((item) => item.classList.toggle('active', item.id === panel));
        });
      });

      document.querySelectorAll('.nav-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const panel = button.dataset.panel;
          state.activeTab = panel;
          document.querySelectorAll('.nav-btn').forEach((nav) => nav.classList.toggle('active', nav === button));
          document.querySelectorAll('.tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.panel === panel));
          document.querySelectorAll('.panel').forEach((item) => item.classList.toggle('active', item.id === panel));
        });
      });

      prevPageBtn.addEventListener('click', () => changePage(-1));
      nextPageBtn.addEventListener('click', () => changePage(1));
      conversationPrevBtn.addEventListener('click', () => changeConversationPage(-1));
      conversationNextBtn.addEventListener('click', () => changeConversationPage(1));
      document.getElementById('sendBtn').addEventListener('click', addUserMessage);
      userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addUserMessage();
      });

      renderWords();
      renderTopics();
      renderChat();
    </script>
  </body>
</html>
